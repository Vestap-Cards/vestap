<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF6F0">
<title>Cafe</title>
<style>
:root{--bg:#FAF6F0;--ink:#2A2420;--mute:#6E655C;--line:rgba(42,36,32,.14);--accent:#2F5D50;--on-accent:#fff}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto}
.banner{position:relative;height:calc(190px + env(safe-area-inset-top,0px));background:var(--accent) center/cover}
.banner.plain::after{content:"";position:absolute;inset:0;background:rgba(250,246,240,.82)}
.logo{position:relative;width:92px;height:92px;margin:-46px auto 0;border-radius:50%;background:#fff center/cover;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--accent);display:grid;place-items:center;font:600 38px Georgia,serif;color:var(--accent)}
h1{font:400 30px/1.15 Georgia,"Times New Roman",serif;text-align:center;margin:16px 24px 4px}
.tag{text-align:center;color:var(--mute);margin:0 24px 26px}
.actions{display:grid;gap:12px;padding:0 20px}
.btn{display:block;width:100%;min-height:60px;text-align:left;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;text-decoration:none;cursor:pointer;transition:transform .12s,border-color .12s}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn b{display:block;font-size:18px;font-weight:600}
.btn span{font-size:14px;color:var(--mute)}
.btn.main span{color:var(--on-accent);opacity:.85}
.btn:active{transform:scale(.98);border-color:var(--accent)}
.btn:focus-visible,.x:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
footer{text-align:center;color:var(--mute);font-size:12px;padding:40px 0 calc(24px + env(safe-area-inset-bottom,0px))}
dialog{width:min(480px,100%);max-height:86vh;margin:auto auto 0;border:0;border-radius:20px 20px 0 0;background:var(--bg);color:var(--ink);padding:0;overflow:auto}
dialog::backdrop{background:rgba(42,36,32,.55)}
dialog[open]{animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line)}
.sh h2{margin:0;font:400 22px Georgia,serif}
.x{background:none;border:0;color:var(--ink);font-size:30px;line-height:1;padding:4px 10px;cursor:pointer}
.sb{padding:4px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.cat{margin:24px 0 4px;font:400 20px Georgia,serif;padding-bottom:6px;border-bottom:2px solid var(--accent);display:inline-block}
.item{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.item small{display:block;color:var(--mute);font-size:14px;line-height:1.35}
.item .p{white-space:nowrap;font-weight:600}
.wf{margin:16px 0}
.wf small{display:block;color:var(--mute)}
.wf strong{font-size:21px;word-break:break-all}
@media (prefers-reduced-motion:reduce){dialog[open]{animation:none}.btn{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<dialog id="sheet"></dialog>
<script>
/* Cafe config. Phase 3 moves this block into one file per cafe. */
const CAFE = {
  name: "Demo Cafe",
  tagline: "Coffee, bakes and slow evenings",
  accent: "#2F5D50",   // the cafe's own color, as a 6-digit hex
  logo: "",            // image path, or leave empty to show the first letter
  banner: "",          // image path, or leave empty for a plain tinted banner
  menuPdf: "",         // optional: link to a PDF menu instead of the built-in menu
  review: "https://search.google.com/local/writereview?placeid=YOUR_PLACE_ID",
  instagram: "https://instagram.com/democafe",
  whatsapp: "",        // optional, digits only, e.g. "919999999999"
  wifi: { name: "DemoCafe_Guest", password: "welcome123" },  // null if the cafe has no WiFi
  menu: [
    { cat: "Coffee", items: [["Espresso", 120, "Double shot"], ["Cappuccino", 160], ["Cold coffee", 190, "With vanilla ice cream"]] },
    { cat: "Bakes", items: [["Butter croissant", 140], ["Chocolate brownie", 150, "Served warm"]] },
    { cat: "Cold drinks", items: [["Fresh lime soda", 90], ["Iced tea", 130]] }
  ]
};
/* ---------------------------------------------------------------- */
const $ = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const dlg = document.getElementById("sheet");
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

const hex = /^#[0-9a-f]{6}$/i.test(CAFE.accent) ? CAFE.accent : "#2F5D50";
const n = parseInt(hex.slice(1), 16);
const lum = (0.299 * (n >> 16) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255;
document.documentElement.style.setProperty("--accent", hex);
document.documentElement.style.setProperty("--on-accent", lum > 0.6 ? "#1F1A17" : "#fff");

function fill(el, title, sub) { el.append($("b", 0, title), $("span", 0, sub)); return el; }
function link(href, title, sub, cls) {
  const a = fill($("a", "btn " + (cls || "")), title, sub);
  a.href = href; a.target = "_blank"; a.rel = "noopener"; return a;
}
function action(title, sub, fn, cls) {
  const b = fill($("button", "btn " + (cls || "")), title, sub);
  b.type = "button"; b.onclick = fn; return b;
}
function openSheet(title, body) {
  const h = $("div", "sh"), x = $("button", "x", "\u00d7");
  x.type = "button"; x.setAttribute("aria-label", "Close"); x.onclick = () => dlg.close();
  h.append($("h2", 0, title), x);
  body.classList.add("sb");
  dlg.replaceChildren(h, body);
  dlg.showModal();
}
function menuSheet() {
  const b = $("div");
  CAFE.menu.forEach(c => {
    b.append($("div", "cat", c.cat));
    c.items.forEach(([name, price, note]) => {
      const r = $("div", "item"), l = $("div");
      l.append($("span", 0, name));
      if (note) l.append($("small", 0, note));
      r.append(l, $("span", "p", "\u20b9" + price));
      b.append(r);
    });
  });
  openSheet("Menu", b);
}
function wifiSheet() {
  const b = $("div"), a = $("div", "wf"), p = $("div", "wf");
  a.append($("small", 0, "Network"), $("strong", 0, CAFE.wifi.name));
  p.append($("small", 0, "Password"), $("strong", 0, CAFE.wifi.password));
  const copy = action("Copy password", "Then paste it in your WiFi settings", async () => {
    try { await navigator.clipboard.writeText(CAFE.wifi.password); copy.querySelector("b").textContent = "Copied"; }
    catch (e) { copy.querySelector("span").textContent = "Press and hold the password to copy it"; }
  }, "main");
  b.append(a, p, copy);
  openSheet("WiFi", b);
}

document.title = CAFE.name;
const banner = $("div", "banner" + (CAFE.banner ? "" : " plain"));
if (CAFE.banner) banner.style.backgroundImage = "url('" + CAFE.banner + "')";
const logo = $("div", "logo", CAFE.logo ? "" : CAFE.name.charAt(0));
if (CAFE.logo) logo.style.backgroundImage = "url('" + CAFE.logo + "')";

const acts = $("div", "actions");
acts.append(CAFE.menuPdf
  ? link(CAFE.menuPdf, "See the menu", "Food, drinks and prices", "main")
  : action("See the menu", "Food, drinks and prices", menuSheet, "main"));
acts.append(link(CAFE.review, "Leave a Google review", "Tell others what you enjoyed"));
acts.append(link(CAFE.instagram, "Follow on Instagram", "See what is new at the cafe"));
if (CAFE.whatsapp) acts.append(link("https://wa.me/" + CAFE.whatsapp, "Message on WhatsApp", "Reservations and questions"));
if (CAFE.wifi) acts.append(action("Connect to WiFi", "Network name and password", wifiSheet));

document.getElementById("app").append(banner, logo, $("h1", 0, CAFE.name), $("p", "tag", CAFE.tagline), acts, $("footer", 0, "Powered by Vestap"));
</script>
</body>
</html>
